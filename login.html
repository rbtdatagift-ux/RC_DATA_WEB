<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - RC DATA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">
      RC
    </div>

    <h1>Welcome Back</h1>

    <p>Login to your RC DATA account</p>

  </div>


  <div class="card">

    <label>Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
    >


    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
    >


    <button class="button" onclick="loginUser()">
      LOGIN
    </button>


    <button
      class="button"
      onclick="window.location.href='register.html'"
    >
      CREATE ACCOUNT
    </button>

  </div>


  <div class="footer">
    RC DATA • Fast • Secure • Reliable
  </div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
