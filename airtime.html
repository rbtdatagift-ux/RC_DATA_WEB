<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Airtime - RC DATA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">RC</div>

    <h1>Buy Airtime</h1>

    <p>Recharge any network instantly</p>

  </div>


  <div class="card">

    <label>Network</label>

    <select id="airtimeNetwork">

      <option value="">
        Select Network
      </option>

      <option value="MTN">
        MTN
      </option>

      <option value="Airtel">
        Airtel
      </option>

      <option value="Glo">
        Glo
      </option>

      <option value="9mobile">
        9mobile
      </option>

    </select>


    <label>Phone Number</label>

    <input
      type="tel"
      id="airtimePhone"
      placeholder="08012345678"
    >


    <label>Amount</label>

    <input
      type="number"
      id="airtimeAmount"
      placeholder="Enter amount"
      min="50"
    >


    <button
      class="button"
      onclick="buyAirtime()">

      BUY AIRTIME

    </button>

  </div>


  <div class="footer">
    RC DATA • Fast • Secure • Reliable
  </div>

</div>


<script
  type="module"
  src="app.js">
</script>

</body>

</html>
