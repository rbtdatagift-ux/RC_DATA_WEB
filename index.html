<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RC DATA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">RC</div>

    <h1>RC DATA</h1>

    <p id="welcomeText">Welcome</p>

  </div>


  <div class="card">

    <div class="balance-label">
      Wallet Balance
    </div>

    <div class="balance" id="walletBalance">
  ₦0.00
</div>

    <button class="button">
      Fund Wallet
    </button>

  </div>


  <div class="services">

    <div class="service">
      <div class="service-icon">📶</div>
      <p>Data</p>
    </div>

    <div class="service">
      <div class="service-icon">📞</div>
      <p>Airtime</p>
    </div>

    <div class="service">
      <div class="service-icon">📺</div>
      <p>TV</p>
    </div>

    <div class="service">
      <div class="service-icon">⚡</div>
      <p>Electricity</p>
    </div>

    <div class="service">
      <div class="service-icon">🧾</div>
      <p>History</p>
    </div>

    <div class="service">
      <div class="service-icon">👤</div>
      <p>Profile</p>
    </div>

  </div>


  <div class="card">

    <button class="button" onclick="logoutUser()">
      LOGOUT
    </button>

  </div>


  <div class="footer">
    RC DATA © 2026
  </div>

</div>


<script type="module" src="app.js"></script>

</body>
</html>
