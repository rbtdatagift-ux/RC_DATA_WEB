<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Data - RC DATA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">RC</div>

    <h1>Buy Data</h1>

    <p>Choose your network and data plan</p>

  </div>


  <div class="card">

    <label>Network</label>

    <select id="network">

      <option value="">
        Select Network
      </option>

      <option value="MTN">
        MTN
      </option>

      <option value="Airtel">
        Airtel
      </option>

      <option value="Glo">
        Glo
      </option>

      <option value="9mobile">
        9mobile
      </option>

    </select>


    <label>Phone Number</label>

    <input
      type="tel"
      id="phone"
      placeholder="08012345678"
    >


    <label>Data Plan</label>

    <select id="plan">

      <option value="">
        Select Data Plan
      </option>

      <option value="1GB">
        1GB
      </option>

      <option value="2GB">
        2GB
      </option>

      <option value="5GB">
        5GB
      </option>

      <option value="10GB">
        10GB
      </option>

    </select>


    <button
      class="button"
      onclick="buyData()">

      BUY DATA

    </button>

  </div>


  <div class="footer">
    RC DATA • Fast • Secure • Reliable
  </div>

</div>


<script type="module"
        src="app.js"></script>

</body>

</html>
